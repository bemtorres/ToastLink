name: ToastLink Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: WebDroidBridgeWeb/package-lock.json

      - name: Empaquetar React
        working-directory: WebDroidBridgeWeb
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Instalar el SDK de Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Ejecutar pruebas y generar el APK
        working-directory: WebDroidBridgeAPP
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v6
        with:
          name: toastlink-debug
          path: WebDroidBridgeAPP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Publicar APK en GitHub Releases
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: toastlink-debug

      - name: Publicar el APK de demostración
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TOASTLINK_TAG: ${{ github.ref_name }}
        run: |
          mv app-debug.apk toastlink-debug.apk
          if gh release view "$TOASTLINK_TAG" >/dev/null 2>&1; then
            gh release upload "$TOASTLINK_TAG" toastlink-debug.apk --clobber
          else
            gh release create "$TOASTLINK_TAG" toastlink-debug.apk \
              --verify-tag --title "ToastLink $TOASTLINK_TAG" --generate-notes
          fi
